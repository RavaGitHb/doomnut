<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050508">
<title>DOOMNUT — A social deduction party game</title>
<meta name="description" content="DOOMNUT — A social deduction party game for 4 to 8 players on a single device. Find the secret word, unmask the Virus, beat the Parasite. Free on Google Play.">
<link rel="canonical" href="https://ravagithb.github.io/doomnut/">
<link rel="icon" type="image/png" href="support_assets/favicon.png">
<link rel="apple-touch-icon" href="support_assets/favicon.png">
<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="DOOMNUT — A social deduction party game">
<meta property="og:description" content="A social deduction party game for 4 to 8 players on a single device. Find the secret word, unmask the Virus, beat the Parasite.">
<meta property="og:image" content="https://ravagithb.github.io/doomnut/support_assets/og_image.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="500">
<meta property="og:url" content="https://ravagithb.github.io/doomnut/">
<meta property="og:site_name" content="DOOMNUT">
<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="DOOMNUT — A social deduction party game">
<meta name="twitter:description" content="A social deduction party game for 4 to 8 players on a single device.">
<meta name="twitter:image" content="https://ravagithb.github.io/doomnut/support_assets/og_image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050508;
    --cyan:#80DEEA;
    --cyan-strong:#00E5FF;
    --red-virus:#FF1744;
    --teal:#003333;
    --purple:#7C4DFF;
    --cream:#F5F5DC;
    --text:rgba(255,255,255,0.85);
    --text-muted:#888888;
    --border-faint:rgba(128,222,234,0.20);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    min-height:100%;
    background:#000;
    color:var(--text);
    font-family:'Montserrat',sans-serif;
    line-height:1.5;
    /* No overflow on body — would break position:fixed on iOS Safari.
       Horizontal clipping is handled by .page-clip wrapper instead. */
  }
  .page-clip{
    width:100%;
    overflow-x:hidden;
  }

  /* ===== STARFIELD ===== */
  .space{position:fixed;inset:0;z-index:0;background:var(--bg);overflow:hidden}
  .stars{position:absolute;left:-200px;right:-200px;top:0;height:100%;background-repeat:repeat;will-change:transform}
  .stars.s1{
    background-image:
      radial-gradient(1px 1px at 20px 30px,#fff,transparent),
      radial-gradient(1px 1px at 40px 70px,rgba(255,255,255,0.7),transparent),
      radial-gradient(1px 1px at 90px 40px,rgba(255,255,255,0.6),transparent),
      radial-gradient(1px 1px at 130px 80px,#fff,transparent),
      radial-gradient(1px 1px at 160px 120px,rgba(255,255,255,0.7),transparent),
      radial-gradient(1px 1px at 50px 160px,#fff,transparent),
      radial-gradient(1px 1px at 180px 200px,#fff,transparent),
      radial-gradient(1px 1px at 30px 230px,rgba(255,255,255,0.5),transparent),
      radial-gradient(1px 1px at 70px 280px,#fff,transparent),
      radial-gradient(1px 1px at 110px 320px,rgba(255,255,255,0.7),transparent);
    background-size:200px 350px;
    animation:drift1 240s linear infinite;
    opacity:0.85;
  }
  .stars.s2{
    background-image:
      radial-gradient(1.5px 1.5px at 30px 50px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 130px 90px,rgba(255,255,255,0.85),transparent),
      radial-gradient(1.5px 1.5px at 200px 30px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 70px 180px,rgba(128,222,234,0.85),transparent),
      radial-gradient(1.5px 1.5px at 250px 220px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 180px 280px,rgba(255,255,255,0.7),transparent);
    background-size:300px 350px;
    animation:drift2 140s linear infinite, twinkle 6s ease-in-out infinite;
  }
  .stars.s3{
    background-image:
      radial-gradient(2.5px 2.5px at 80px 60px,#fff,transparent),
      radial-gradient(3px 3px at 220px 140px,rgba(128,222,234,1),transparent),
      radial-gradient(2px 2px at 350px 200px,#fff,transparent),
      radial-gradient(3px 3px at 120px 300px,rgba(128,222,234,0.9),transparent),
      radial-gradient(2.5px 2.5px at 280px 380px,#fff,transparent);
    background-size:420px 450px;
    animation:drift3 70s linear infinite, twinkle 3s ease-in-out infinite;
    filter:drop-shadow(0 0 3px rgba(128,222,234,0.6));
  }
  @keyframes drift1{from{transform:translateX(0)}to{transform:translateX(-200px)}}
  @keyframes drift2{from{transform:translateX(0)}to{transform:translateX(-300px)}}
  @keyframes drift3{from{transform:translateX(0)}to{transform:translateX(-420px)}}
  @keyframes twinkle{0%,100%{filter:brightness(1) drop-shadow(0 0 3px rgba(128,222,234,0.6))}50%{filter:brightness(0.55) drop-shadow(0 0 1px rgba(128,222,234,0.3))}}

  .scanlines{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,0.20) 2px,rgba(0,0,0,0.20) 4px);
  }

  /* ===== CONTENT ===== */
  .container{
    position:relative;
    z-index:10;
    max-width:880px;
    margin:0 auto;
    padding:24px 24px 40px;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }

  /* ===== LANG SWITCH ===== */
  .lang-switch{
    position:fixed;
    top:18px;right:18px;
    z-index:20;
    display:flex;gap:8px;
  }
  .lang-btn{
    padding:8px 14px;
    background:rgba(0,51,51,0.65);
    border:2px solid var(--cyan);
    border-radius:8px;
    color:var(--cyan);
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:0.74rem;
    letter-spacing:0.20em;
    cursor:pointer;
    text-transform:uppercase;
    text-shadow:0 0 8px rgba(128,222,234,0.7);
    box-shadow:0 0 14px rgba(128,222,234,0.25);
    transition:all 0.25s;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .lang-btn:hover{
    background:rgba(0,51,51,0.95);
    box-shadow:0 0 24px rgba(128,222,234,0.50);
    transform:translateY(-1px);
  }
  .lang-btn.active{
    background:var(--cyan);
    color:#000;
    text-shadow:none;
    box-shadow:0 0 18px rgba(128,222,234,0.55);
    cursor:default;
  }

  /* ===== HERO TITLE (bigger than support page) ===== */
  header{
    text-align:center;
    padding:60px 0 40px;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .title-wrap{
    position:relative;
    display:block;
    width:min(820px,95vw);
    aspect-ratio:560/175;
    margin:0 auto;
  }
  .title-wrap > div{
    position:absolute;inset:0;
    background-position:center;
    background-repeat:no-repeat;
    background-size:contain;
    pointer-events:none;
  }
  .title-halo{
    background:radial-gradient(ellipse 60% 55% at 50% 50%,rgba(128,222,234,0.55) 0%,rgba(128,222,234,0.20) 35%,transparent 70%);
    filter:blur(28px);
    animation:halo 4s ease-in-out infinite alternate;
    z-index:0;
  }
  .title-base{
    background-image:url('support_assets/doomnuttitre_layer1.webp');
    opacity:0.90;
    z-index:1;
  }
  .title-shimmer{
    background-image:linear-gradient(105deg,transparent 35%,rgba(255,255,255,0.45) 50%,transparent 65%);
    background-size:200% 100%;
    -webkit-mask-image:url('support_assets/doomnuttitre_layer1.webp');
    mask-image:url('support_assets/doomnuttitre_layer1.webp');
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    mix-blend-mode:screen;
    animation:shimmer 5s linear infinite;
    z-index:2;
  }
  .title-glow{
    background-image:url('support_assets/doomnuttitre_layer2.webp');
    animation:breath 4s ease-in-out infinite alternate;
    transform-origin:center;
    z-index:3;
  }
  .title-glitch{
    -webkit-mask-image:url('support_assets/doomnuttitre_layer1.webp');
    mask-image:url('support_assets/doomnuttitre_layer1.webp');
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    mix-blend-mode:screen;
    opacity:0;
    z-index:4;
  }
  .title-glitch.g-red{background-color:var(--red-virus);animation:glitchRed 5.7s steps(1,end) infinite}
  .title-glitch.g-purple{background-color:var(--purple);animation:glitchPurple 7.3s steps(1,end) infinite}
  .title-glitch.g-cream{background-color:var(--cream);animation:glitchCream 6.1s steps(1,end) infinite}

  @keyframes shimmer{from{background-position:-100% 0}to{background-position:200% 0}}
  @keyframes breath{from{transform:scale(1.0);opacity:0.5}to{transform:scale(1.06);opacity:1.0}}
  @keyframes halo{from{opacity:0.30}to{opacity:0.95}}
  @keyframes glitchRed{
    0%,38%,42%,100%{opacity:0;transform:translate(0,0)}
    39%{opacity:0.55;transform:translate(-3px,1px)}
    40%{opacity:0;transform:translate(0,0)}
    41%{opacity:0.4;transform:translate(2px,-1px)}
  }
  @keyframes glitchPurple{
    0%,67%,71%,100%{opacity:0;transform:translate(0,0)}
    68%{opacity:0.45;transform:translate(2px,-2px)}
    70%{opacity:0.30;transform:translate(-1px,1px)}
  }
  @keyframes glitchCream{
    0%,52%,55%,100%{opacity:0;transform:translate(0,0)}
    53%{opacity:0.30;transform:translate(-2px,2px)}
    54%{opacity:0;transform:translate(0,0)}
  }

  .tagline{
    margin-top:28px;
    color:var(--text-muted);
    font-size:0.84rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    font-weight:500;
  }

  /* ===== INSTALL CARDS ===== */
  .install-section{margin:50px 0 24px}
  .install-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:28px;
    max-width:720px;
    margin:0 auto;
  }
  .install-card{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:26px 20px;
    background:linear-gradient(180deg, rgba(0,80,90,0.55) 0%, rgba(0,15,25,0.90) 100%);
    border:2px solid var(--cyan);
    border-radius:10px;
    text-decoration:none;
    text-align:center;
    box-shadow:0 0 22px rgba(128,222,234,0.25), inset 0 1px 0 rgba(128,222,234,0.55);
    transition:all 0.3s;
    overflow:hidden;
  }
  .install-card::before{
    content:'';
    position:absolute;
    top:0;left:50%;
    width:65%;
    height:2px;
    transform:translateX(-50%);
    background:linear-gradient(90deg, transparent 0%, var(--cyan-strong) 50%, transparent 100%);
    box-shadow:0 0 12px var(--cyan-strong);
  }
  .install-card::after{
    content:'';
    position:absolute;
    top:55%;left:50%;
    width:80%;height:80%;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(128,222,234,0.18) 0%, transparent 65%);
    pointer-events:none;
    z-index:0;
  }
  .install-card > *{position:relative;z-index:1}
  .install-card:hover{
    background:linear-gradient(180deg, rgba(0,110,120,0.75) 0%, rgba(0,30,40,0.95) 100%);
    box-shadow:0 0 36px rgba(128,222,234,0.55), inset 0 1px 0 rgba(128,222,234,0.9);
    transform:translateY(-4px);
  }
  .install-card.disabled{
    cursor:not-allowed;
    opacity:0.62;
    pointer-events:none;
  }
  .install-card.disabled::before{
    background:linear-gradient(90deg, transparent 0%, rgba(128,222,234,0.30) 50%, transparent 100%);
    box-shadow:none;
  }
  .install-card.disabled::after{display:none}
  .install-badge{
    display:block;
    width:180px;
    height:auto;
    aspect-ratio:3.375 / 1;
    filter:drop-shadow(0 0 12px rgba(128,222,234,0.50));
    transition:filter 0.3s;
  }
  .install-card:hover .install-badge{
    filter:drop-shadow(0 0 22px rgba(128,222,234,0.80));
  }
  .install-card.disabled .install-badge{
    filter:grayscale(0.85) brightness(0.75) drop-shadow(0 0 6px rgba(128,222,234,0.20));
  }
  .install-status{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:0.72rem;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--cyan);
    text-shadow:0 0 8px rgba(128,222,234,0.65);
  }
  .install-card.disabled .install-status{
    color:var(--text-muted);
    text-shadow:none;
    letter-spacing:0.30em;
  }

  /* ===== PAGE NAV ===== */
  .page-nav{
    display:flex;justify-content:center;gap:12px;flex-wrap:wrap;
    margin-top:auto;padding-top:32px;
    border-top:1px solid var(--border-faint);
  }
  .nav-link{
    padding:12px 22px;
    background:rgba(0,51,51,0.65);
    border:2px solid var(--cyan);
    border-radius:8px;
    color:var(--cyan);
    text-decoration:none;
    font-weight:700;
    font-size:0.82rem;
    letter-spacing:0.20em;
    text-transform:uppercase;
    text-shadow:0 0 8px rgba(128,222,234,0.7);
    box-shadow:0 0 14px rgba(128,222,234,0.25);
    transition:all 0.25s;
  }
  .nav-link:hover{
    background:rgba(0,51,51,0.95);
    box-shadow:0 0 24px rgba(128,222,234,0.50);
    transform:translateY(-2px);
  }

  /* ===== FOOTER ===== */
  footer{
    margin-top:24px;
    text-align:center;
    color:var(--text-muted);
    font-size:0.72rem;letter-spacing:0.15em;font-weight:500;
  }

  @media (max-width:540px){
    .container{padding:14px 12px 28px}
    header{flex:0 0 auto; padding:58px 0 12px}
    .title-wrap{
      width:180vw;
      max-width:none;
      margin-left:-40vw;
      margin-right:-40vw;
    }
    .tagline{margin-top:14px;font-size:0.62rem;letter-spacing:0.20em}
    .install-section{margin:30px 0 16px}
    .install-grid{grid-template-columns:1fr; gap:14px; max-width:320px}
    .install-card{padding:18px 14px;gap:10px}
    .install-badge{width:160px}
    .install-status{font-size:0.62rem;letter-spacing:0.18em}
    .nav-link{padding:9px 14px;font-size:0.66rem;letter-spacing:0.14em}
    .page-nav{gap:8px;padding-top:24px;margin-top:auto}
    .lang-switch{
      top:6px;right:6px;
      flex-direction:column;
      gap:3px;
    }
    .lang-btn{
      padding:3px 7px;
      font-size:0.48rem;
      letter-spacing:0.08em;
      min-width:32px;
      border-width:1px;
      background:rgba(0,30,40,0.50);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      box-shadow:0 0 8px rgba(128,222,234,0.18);
    }
    footer{font-size:0.62rem;margin-top:14px}
  }
  @media (max-width:380px){
    .container{padding:10px 8px 24px}
    .install-badge{width:148px}
    .nav-link{padding:8px 11px;font-size:0.62rem;letter-spacing:0.10em}
    .page-nav{gap:6px}
  }
</style>
</head>
<body>

<div class="space" aria-hidden="true">
  <div class="stars s1"></div>
  <div class="stars s2"></div>
  <div class="stars s3"></div>
</div>
<div class="scanlines" aria-hidden="true"></div>

<div class="lang-switch" role="group" aria-label="Language">
  <button class="lang-btn" data-lang="en" type="button">EN</button>
  <button class="lang-btn" data-lang="fr" type="button">FR</button>
</div>

<div class="page-clip">
<div class="container">

  <header>
    <div class="title-wrap" aria-label="DOOMNUT" role="img">
      <div class="title-halo"></div>
      <div class="title-base"></div>
      <div class="title-shimmer"></div>
      <div class="title-glow"></div>
      <div class="title-glitch g-red"></div>
      <div class="title-glitch g-purple"></div>
      <div class="title-glitch g-cream"></div>
    </div>
    <div class="tagline" data-i18n="tagline">Social Deduction · 4 to 8 Players</div>
  </header>

  <section class="install-section">
    <div class="install-grid">
      <a class="install-card"
         href="https://play.google.com/store/apps/details?id=com.doomnut.app"
         target="_blank" rel="noopener"
         aria-label="Get DOOMNUT on Google Play">
        <img class="install-badge"
             src="support_assets/google_play_badge.svg"
             alt="Get it on Google Play">
        <div class="install-status" data-i18n="availableNow">Available now</div>
      </a>
      <div class="install-card disabled" aria-disabled="true">
        <img class="install-badge"
             src="support_assets/app_store_badge.svg"
             alt="Download on the App Store">
        <div class="install-status" data-i18n="comingSoon">Coming soon</div>
      </div>
    </div>
  </section>

  <nav class="page-nav">
    <a class="nav-link" href="support.html" data-i18n="navSupport">Support</a>
    <a class="nav-link" href="rules.html" data-i18n="navRules">Rules</a>
    <a class="nav-link" href="privacy.html" data-i18n="navPrivacy">Privacy</a>
  </nav>

  <footer>
    <p>2026 Rava Studio</p>
  </footer>

</div>
</div>

<script>
  const I18N = {
    en: {
      tagline: "Social Deduction · 4 to 8 Players",
      availableNow: "Available now",
      comingSoon: "Coming soon",
      navSupport: "Support",
      navRules: "Rules",
      navPrivacy: "Privacy",
      _title: "DOOMNUT — A social deduction party game",
      _htmlLang: "en",
    },
    fr: {
      tagline: "Déduction Sociale · 4 à 8 Joueurs",
      availableNow: "Disponible maintenant",
      comingSoon: "Bientôt disponible",
      navSupport: "Support",
      navRules: "Règles",
      navPrivacy: "Confidentialité",
      _title: "DOOMNUT — Un jeu de déduction sociale",
      _htmlLang: "fr",
    },
  };

  function applyLang(lang){
    const dict = I18N[lang] || I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      if (dict[k] !== undefined) el.textContent = dict[k];
    });
    if (dict._title) document.title = dict._title;
    if (dict._htmlLang) document.documentElement.setAttribute('lang', dict._htmlLang);
    document.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    try { localStorage.setItem('doomnut.lang', lang); } catch(e) {}
  }

  function detectLang(){
    try {
      const saved = localStorage.getItem('doomnut.lang');
      if (saved && I18N[saved]) return saved;
    } catch(e) {}
    const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    return nav.startsWith('fr') ? 'fr' : 'en';
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => applyLang(btn.dataset.lang));
  });

  applyLang(detectLang());
</script>

</body>
